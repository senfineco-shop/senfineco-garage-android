name: Build Senfineco Garage (AAB + APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore upload keystore from the UPLOAD_KEYSTORE_BUNDLE secret
        env:
          BUNDLE: ${{ secrets.UPLOAD_KEYSTORE_BUNDLE }}
        run: |
          if [ -z "$BUNDLE" ]; then
            echo "::error::Repository secret UPLOAD_KEYSTORE_BUNDLE is missing. Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          echo "$BUNDLE" | base64 -d | tar xz -C app/
          test -f app/keystore/upload.jks && test -f app/keystore/keystore.properties
          echo "keystore restored"

      - name: Build release AAB (for Google Play)
        run: gradle :app:bundleRelease --no-daemon --stacktrace

      - name: Build release APK (for direct install on tablets)
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename outputs
        run: |
          mkdir -p out
          cp app/build/outputs/bundle/release/app-release.aab "out/senfineco-garage-v${VERSION_CODE}.aab"
          cp app/build/outputs/apk/release/app-release.apk "out/senfineco-garage-v${VERSION_CODE}.apk"
          ls -la out

      - name: Upload AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: senfineco-garage-aab-v${{ github.run_number }}
          path: out/*.aab
          if-no-files-found: error

      - name: Upload APK (direct install)
        uses: actions/upload-artifact@v4
        with:
          name: senfineco-garage-apk-v${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
