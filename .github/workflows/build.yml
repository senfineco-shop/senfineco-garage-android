name: Build Senfineco Garage (AAB + APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

# contents: write → the job may publish GitHub Releases (fixed download link)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore upload keystore from the UPLOAD_KEYSTORE_BUNDLE secret
        env:
          BUNDLE: ${{ secrets.UPLOAD_KEYSTORE_BUNDLE }}
        run: |
          if [ -z "$BUNDLE" ]; then
            echo "::error::Repository secret UPLOAD_KEYSTORE_BUNDLE is missing. Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          echo "$BUNDLE" | base64 -d | tar xz -C app/
          test -f app/keystore/upload.jks && test -f app/keystore/keystore.properties
          echo "keystore restored"

      - name: Build release AAB (for Google Play)
        run: gradle :app:bundleRelease --no-daemon --stacktrace

      - name: Build release APK (for direct install on tablets)
        run: gradle :app:assembleRelease --no-daemon

      - name: Collect outputs
        run: |
          mkdir -p out
          cp app/build/outputs/bundle/release/app-release.aab "out/senfineco-garage-v${VERSION_CODE}.aab"
          cp app/build/outputs/apk/release/app-release.apk "out/senfineco-garage-v${VERSION_CODE}.apk"
          # Fixed names → the "latest" download links never change
          cp "out/senfineco-garage-v${VERSION_CODE}.apk" out/senfineco-garage.apk
          cp "out/senfineco-garage-v${VERSION_CODE}.aab" out/senfineco-garage.aab
          cat > out/version.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apk": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/senfineco-garage.apk",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${GITHUB_SHA}"
          }
          EOF
          cat out/version.json
          ls -la out

      - name: Upload AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: senfineco-garage-aab-v${{ github.run_number }}
          path: out/senfineco-garage-v*.aab
          if-no-files-found: error

      - name: Upload APK (direct install)
        uses: actions/upload-artifact@v4
        with:
          name: senfineco-garage-apk-v${{ github.run_number }}
          path: out/senfineco-garage-v*.apk
          if-no-files-found: error

      # Publishes release v<N> and marks it "Latest", so these links always serve the newest build:
      #   https://github.com/<repo>/releases/latest/download/senfineco-garage.apk
      #   https://github.com/<repo>/releases/latest/download/version.json
      - name: Publish GitHub Release (fixed download link)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_CODE}"
          # A re-run of the same run number: replace the previous release + tag
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          NOTES="$(printf 'Senfineco Garage %s (build %s)\n\nFixed download link (always the newest build):\nhttps://github.com/%s/releases/latest/download/senfineco-garage.apk\n\nCommit: %s' \
            "$VERSION_NAME" "$VERSION_CODE" "$GITHUB_REPOSITORY" "$GITHUB_SHA")"
          gh release create "$TAG" \
            out/senfineco-garage.apk \
            out/senfineco-garage.aab \
            out/version.json \
            "out/senfineco-garage-v${VERSION_CODE}.apk" \
            "out/senfineco-garage-v${VERSION_CODE}.aab" \
            --target "$GITHUB_SHA" \
            --title "Senfineco Garage ${VERSION_NAME} (build ${VERSION_CODE})" \
            --notes "$NOTES" \
            --latest
          echo "Fixed APK link: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/senfineco-garage.apk"
